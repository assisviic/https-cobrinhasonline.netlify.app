<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>COBRINHAS - Arena Multiplayer Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #060a12; font-family: 'Inter', system-ui, sans-serif; }
    #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #lobbyOverlay { touch-action: pan-y; }
    #lobbyOverlay input { user-select: text; -webkit-user-select: text; }
  </style>
</head>
<body class="bg-[#060a12] text-slate-100">

  <canvas id="gameCanvas"></canvas>

  <!-- HUD SUPERIOR (Controlado estritamente por ID e display style) -->
  <div id="hudOverlay" style="display: none;" class="fixed inset-0 pointer-events-none z-20 p-4 flex flex-col justify-between">
    <div class="flex items-start justify-between">
      <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-3 pointer-events-auto">
        <div class="text-xs font-bold text-slate-400">Pontos</div>
        <div id="hudScore" class="text-xl font-black text-emerald-400">10</div>
        <button id="leaveRoomBtn" class="mt-2 px-3 py-1.5 rounded-xl bg-rose-950 hover:bg-rose-800 text-xs font-bold text-rose-200 transition">Sair para o Lobby</button>
      </div>
    </div>
  </div>

  <!-- LOBBY INICIAL -->
  <div id="lobbyOverlay" style="display: flex;" class="fixed inset-0 z-30 items-center justify-center p-4 bg-[#070b14]/90">
    <div class="w-full max-w-[390px] rounded-[26px] bg-[#0e1526] border border-emerald-500/20 p-6 shadow-2xl text-center">
      <h1 class="text-3xl font-black text-[#7af5d8] mb-2">COBRINHAS</h1>
      <p class="text-xs text-slate-300 mb-4">Coma orbes e domine a arena!</p>
      <input id="nicknameInput" type="text" maxlength="16" placeholder="Seu Apelido" class="w-full px-3.5 py-3 rounded-xl bg-[#101829] border border-slate-700 text-white mb-4 text-center focus:outline-none focus:border-emerald-400" />
      <button id="startGameBtn" type="button" class="w-full py-3.5 rounded-2xl bg-[#10b981] hover:bg-emerald-400 text-slate-950 font-black uppercase tracking-wide shadow-lg transition">
        ENTRAR NA SALA
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const lobbyOverlay = document.getElementById('lobbyOverlay');
    const hudOverlay = document.getElementById('hudOverlay');
    const startGameBtn = document.getElementById('startGameBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const nicknameInput = document.getElementById('nicknameInput');

    let isPlaying = false;
    let me = { x: 1600, y: 1600, score: 10, segments: [] };
    let orbs = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i=0; i<120; i++) {
      orbs.push({ x: Math.random() * 3200, y: Math.random() * 3200, color: '#10b981', radius: 6 });
    }

    startGameBtn.addEventListener('click', () => {
      me.x = 1600; me.y = 1600; me.score = 10;
      me.segments = [];
      for(let i=0; i<15; i++) me.segments.push({x: 1600 - i*10, y: 1600});

      // Esconde o lobby e ativa o HUD e o jogo de forma limpa
      lobbyOverlay.style.display = 'none';
      hudOverlay.style.display = 'flex';
      isPlaying = true;
    });

    leaveRoomBtn.addEventListener('click', () => {
      isPlaying = false;
      // Esconde o HUD e força o lobby a reaparecer centralizado
      hudOverlay.style.display = 'none';
      lobbyOverlay.style.display = 'flex';
    });

    window.addEventListener('mousemove', (e) => {
      if(!isPlaying) return;
      const angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
      me.x += Math.cos(angle) * 3.5;
      me.y += Math.sin(angle) * 3.5;
    });

    function gameLoop() {
      ctx.fillStyle = '#060a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isPlaying) {
        ctx.save();
        ctx.translate(canvas.width/2 - me.x, canvas.height/2 - me.y);

        ctx.strokeStyle = '#11192c';
        ctx.lineWidth = 1;
        for (let x = 0; x <= 3200; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 3200); ctx.stroke(); }
        for (let y = 0; y <= 3200; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(3200, y); ctx.stroke(); }

        for (let o of orbs) {
          ctx.beginPath(); ctx.arc(o.x, o.y, o.radius, 0, Math.PI*2);
          ctx.fillStyle = o.color; ctx.fill();
        }

        ctx.beginPath(); ctx.arc(me.x, me.y, 12, 0, Math.PI*2);
        ctx.fillStyle = '#10b981'; ctx.fill();

        ctx.restore();
        document.getElementById('hudScore').textContent = Math.round(me.score);
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
